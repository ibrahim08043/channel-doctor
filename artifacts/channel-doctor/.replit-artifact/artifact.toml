kind = "web"
previewPath = "/"
title = "Channel Doctor"
version = "1.0.0"
id = "artifacts/channel-doctor"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18598

[services.development]
run = "pnpm --filter @workspace/channel-doctor run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/channel-doctor", "run", "build" ]
publicDir = "artifacts/channel-doctor/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18598"
BASE_PATH = "/"
